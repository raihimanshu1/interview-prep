server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: auth-service
  
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration

  profiles:
    active: dev

app:
  jwt:
    secret: mySecretKey12345678901234567890123456789012345678901234567890
    access-token-expiration: 86400000      # 24 hours
    refresh-token-expiration: 604800000    # 7 days

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.yourapp.auth: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG